<div class="min-h-screen flex items-center justify-center bg-base-200">

  <div class="card w-full max-w-md bg-base-100 shadow-xl">

    <div class="card-body">

      <h2 class="text-2xl font-bold text-center">Forgot Password</h2>

      <p class="text-sm text-center opacity-70">
        Enter your email and we’ll send you a reset link
      </p>

      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-4 mt-4">

        <!-- Email -->
        <div class="form-control">
          <label class="label">
            <span class="label-text">Email</span>
          </label>

          <input
            type="email"
            class="input input-bordered w-full"
            formControlName="email"
            placeholder="email@example.com"
          />

          @if (forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid) {
            <p class="text-error text-sm mt-1">
              Please enter a valid email
            </p>
          }
        </div>

        <!-- Submit -->
        <button
          class="btn btn-primary w-full"
          type="submit"
          [disabled]="forgotForm.invalid"
        >
          Send Reset Link
        </button>

      </form>

      <div class="divider"></div>

      <!-- Back to Login -->
      <button
        class="btn btn-outline w-full"
        (click)="goToLogin()"
      >
        Back to Login
      </button>

    </div>
  </div>

</div>
